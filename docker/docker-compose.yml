###
# docker-compose: TravelPlanner
# cmd:
# cd docker
# docker-compose up
#
name: travel-planner

services:
  postgres:
    container_name: travel-planner-db
    image: postgres:latest

    environment:
      POSTGRES_DB: travel_planner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - travel_pgdata:/var/lib/postgresql

  backend-api:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
    container_name: travel-planner-api
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/travel_planner
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      - postgres

volumes:
  travel_pgdata:
