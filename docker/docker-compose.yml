###
# docker-compose: TravelPlanner
# cmd:
# cd docker
# docker-compose up
#
name: travelplanner

services:
  postgres:
    container_name: travel-postgres
    image: postgres:latest

    environment:
      POSTGRES_DB: travelmanager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - travel_pgdata:/var/lib/postgresql

volumes:
  travel_pgdata: